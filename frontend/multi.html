<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Vista Múltiple - Contadores</title>
<style>
body { 
  font-family: Arial, sans-serif; 
  background-color: #000; 
  color: #fff; 
  margin: 0; 
  padding: 0;
  overflow: hidden;
}

.grid-container {
  display: grid;
  width: 100vw;
  height: 100vh;
  gap: 10px;
  padding: 10px;
  box-sizing: border-box;
}

/* 1 contador - pantalla completa */
.grid-1 {
  grid-template-columns: 1fr;
  grid-template-rows: 1fr;
}

/* 2 contadores */
.grid-2.horizontal {
  grid-template-columns: 1fr 1fr;
  grid-template-rows: 1fr;
}

.grid-2.vertical {
  grid-template-columns: 1fr;
  grid-template-rows: 1fr 1fr;
}

/* 3 contadores */
.grid-3.horizontal {
  grid-template-columns: 1fr 1fr 1fr;
  grid-template-rows: 1fr;
}

.grid-3.vertical {
  grid-template-columns: 1fr;
  grid-template-rows: 1fr 1fr 1fr;
}

/* 4 contadores */
.grid-4.horizontal {
  grid-template-columns: 1fr 1fr;
  grid-template-rows: 1fr 1fr;
}

.grid-4.vertical {
  grid-template-columns: 1fr;
  grid-template-rows: 1fr 1fr 1fr 1fr;
}

/* 5 contadores */
.grid-5.horizontal {
  grid-template-columns: 1fr 1fr 1fr;
  grid-template-rows: 1fr 1fr;
}

.grid-5.vertical {
  grid-template-columns: 1fr;
  grid-template-rows: 1fr 1fr 1fr 1fr 1fr;
}

/* 6 contadores */
.grid-6.horizontal {
  grid-template-columns: 1fr 1fr 1fr;
  grid-template-rows: 1fr 1fr;
}

.grid-6.vertical {
  grid-template-columns: 1fr;
  grid-template-rows: repeat(6, 1fr);
}

.contador-box {
  background-color: #111;
  border: 2px solid #333;
  border-radius: 10px;
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  padding: 20px;
}

.contador-box.activo {
  border-color: #2a5;
}

.nombre-contador {
  position: absolute;
  top: 10px;
  left: 50%;
  transform: translateX(-50%);
  background: rgba(0,0,0,0.7);
  padding: 5px 15px;
  border-radius: 5px;
  font-size: 1.5vh;
  font-weight: bold;
  z-index: 200;
}

.logo-container {
  position: absolute;
  top: 10px;
  left: 10px;
  width: 15%;
  z-index: 100;
}

.logo-container img {
  width: 100%;
  height: auto;
}

.iconos-container {
  position: absolute;
  width: 100%;
  height: 100%;
  top: 0;
  left: 0;
  pointer-events: none;
  z-index: 50;
}

.icono-dinamico {
  position: absolute;
  transform: translate(-50%, -50%);
  object-fit: contain;
  max-width: 20%;
}

.texto-contador {
  font-size: 5vh;
  margin-bottom: 10px;
  text-align: center;
}

.contador-display {
  font-size: 20vh;
  font-weight: bold;
  text-align: center;
  cursor: pointer;
  user-select: none;
  transition: opacity 0.2s;
}

.contador-display:hover {
  opacity: 0.8;
}

.fin-mensaje {
  font-size: 4vh;
  font-weight: bold;
  color: #ff0000;
  margin-top: 10px;
  text-align: center;
}

.tabla-mesas-container {
  position: absolute;
  bottom: 20px;
  left: 50%;
  transform: translateX(-50%);
  width: 90%;
  max-height: 30%;
  overflow-y: auto;
  z-index: 10;
}

.tabla-mesas {
  width: 100%;
  border-collapse: collapse;
  background-color: rgba(20, 20, 20, 0.95);
  border-radius: 5px;
  font-size: clamp(0.8vh, 1.5vh, 2vh);
}

.tabla-mesas th {
  background-color: #ff3b3b;
  padding: 8px;
  font-size: clamp(1vh, 1.8vh, 2.5vh);
  word-wrap: break-word;
}

.tabla-mesas td {
  padding: 6px 8px;
  border-bottom: 1px solid #333;
  font-size: clamp(0.7vh, 1.4vh, 2vh);
  word-wrap: break-word;
  overflow-wrap: break-word;
  line-height: 1.3;
}

.mesa-num {
  font-weight: bold;
  color: #ff8800;
  font-size: clamp(0.9vh, 1.6vh, 2.2vh);
  white-space: nowrap;
}

.vs {
  color: #ff3b3b;
  font-weight: bold;
  padding: 0 5px;
}

.bye {
  color: #888;
  font-style: italic;
}

/* Ajuste automático para muchas filas */
.tabla-mesas tbody tr:nth-child(n+12) td {
  padding: 4px 6px;
  font-size: clamp(0.6vh, 1.2vh, 1.6vh);
}

.tabla-mesas tbody tr:nth-child(n+12) .mesa-num {
  font-size: clamp(0.8vh, 1.4vh, 1.8vh);
}

.tabla-mesas tbody tr:nth-child(n+20) td {
  padding: 3px 4px;
  font-size: clamp(0.5vh, 1vh, 1.4vh);
}

.tabla-mesas tbody tr:nth-child(n+20) .mesa-num {
  font-size: clamp(0.7vh, 1.2vh, 1.6vh);
}


/* Estilos para ronda en vista múltiple */
.tabla-ronda-multi {
  background-color: #2a5;
  color: white;
  padding: 8px;
  border-radius: 5px 5px 0 0;
  text-align: center;
  font-weight: bold;
  font-size: clamp(1.2vh, 2vh, 2.5vh);
  text-transform: uppercase;
  margin-bottom: 0;
}

.tabla-mesas-container-con-ronda .tabla-mesas {
  border-radius: 0 0 5px 5px;
}

audio {
  display: none;
}
</style>
</head>
<body>
<div id="gridContainer" class="grid-container grid-1"></div>

<script>
const API = `${window.location.origin}/api`;
let contadoresActuales = [];
let orientacionActual = 'horizontal';
let audioPlayers = {};
let parpadeoIntervals = {};
const DURACION_PARPADEO = 30000;

function actualizarGrid() {
  const container = document.getElementById('gridContainer');
  const count = contadoresActuales.length;
  
  // Remover clases anteriores
  container.className = 'grid-container';
  
  // Agregar clase segÃºn cantidad y orientaciÃ³n
  if (count === 1) {
    container.classList.add('grid-1');
  } else if (count <= 6) {
    container.classList.add(`grid-${count}`, orientacionActual);
  } else {
    container.classList.add('grid-6', orientacionActual);
  }
}

function crearContadorBox(contador) {
  const box = document.createElement('div');
  box.className = 'contador-box';
  box.id = `contador-${contador.id}`;
  box.style.backgroundColor = contador.colorFondo || '#000';
  
  if (contador.contadorActivo) {
    box.classList.add('activo');
  }
  
  box.innerHTML = `
    <div class="nombre-contador">${contador.nombre}</div>
    
    <div class="logo-container" id="logo-container-${contador.id}">
      ${contador.logo && contador.logo.archivo ? `<img src="/logos/${contador.logo.archivo}" alt="Logo">` : ''}
    </div>
    
    <div class="iconos-container" id="iconos-${contador.id}"></div>
    
    <div class="texto-contador" style="color: ${contador.colorTexto}; font-size: ${parseFloat(contador.tamanoTexto) / 2}vh;">
      ${contador.texto}
    </div>
    
    <div class="contador-display" 
         style="color: ${contador.colorContador}; font-size: ${parseFloat(contador.tamanoContador) / 2}vh;"
         onclick="toggleContador('${contador.id}')">
      ${formatoTiempo(contador.tiempoRestante)}
    </div>
    
    <div class="fin-mensaje" id="fin-${contador.id}"></div>
    
    <div class="tabla-mesas-container" id="mesas-${contador.id}"></div>
    
    <audio id="audio-${contador.id}"></audio>
  `;
  
  return box;
}

function formatoTiempo(segundos) {
  const m = Math.floor(segundos / 60);
  const s = segundos % 60;
  return `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
}

async function toggleContador(id) {
  const contador = contadoresActuales.find(c => c.id === id);
  if (!contador) return;
  
  if (!contador.contadorActivo && contador.tiempoRestante > 0) {
    await fetch(`${API}/contador/${id}/start`, { method: 'POST' });
  }
}

function actualizarIconos(contador) {
  const container = document.getElementById(`iconos-${contador.id}`);
  if (!container) return;
  
  if (!contador.iconos || contador.iconos.length === 0) {
    container.innerHTML = '';
    return;
  }
  
  contador.iconos.forEach(icono => {
    if (!icono.visible) {
      const existente = document.getElementById(`icono-${contador.id}-${icono.id}`);
      if (existente) existente.remove();
      return;
    }
    
    let img = document.getElementById(`icono-${contador.id}-${icono.id}`);
    
    if (!img) {
      img = document.createElement('img');
      img.id = `icono-${contador.id}-${icono.id}`;
      img.className = 'icono-dinamico';
      container.appendChild(img);
    }
    
    img.src = `/iconos/${icono.archivo}`;
    img.style.width = `${icono.tamano / 5}px`;
    img.style.left = `${icono.posX}%`;
    img.style.top = `${icono.posY}%`;
  });
}

function actualizarMesas(contador) {
  const container = document.getElementById(`mesas-${contador.id}`);
  if (!container) return;
  
  if (!contador.mesas || contador.mesas.length === 0) {
    container.innerHTML = '';
    return;
  }
  
  // Verificar temporizador de visibilidad
  if (contador.configMesas && contador.configMesas.tiempoVisible !== null && contador.configMesas.timestampContadorInicio) {
    const tiempoTranscurrido = (Date.now() - contador.configMesas.timestampContadorInicio) / 1000;
    if (tiempoTranscurrido > contador.configMesas.tiempoVisible) {
      container.innerHTML = '';
      return;
    }
  }
  
  const mesasActivas = contador.mesas.filter(m => m.activa);
  if (mesasActivas.length === 0) {
    container.innerHTML = '';
    return;
  }
  
  const tituloMesa = (contador.configMesas && contador.configMesas.tituloMesa) || 'Mesa';
  const tituloEmparejamiento = (contador.configMesas && contador.configMesas.tituloEmparejamiento) || 'Emparejamiento';
  const columnas = (contador.configMesas && contador.configMesas.columnas) || 1;

  // Dividir mesas en N grupos
  const grupos = [];
  for (let i = 0; i < columnas; i++) {
    grupos.push([]);
  }
  mesasActivas.forEach((m, idx) => {
    grupos[idx % columnas].push(m);
  });

  let html = '<div style="display:flex; gap:10px; justify-content:center; width:100%;">';
  grupos.forEach(grupo => {
    html += `<table class="tabla-mesas" style="flex:1;"><thead><tr><th>${tituloMesa}</th><th>${tituloEmparejamiento}</th></tr></thead><tbody>`;
    grupo.forEach(m => {
      let emparejamiento;
      if (m.jugador2 === '' || m.jugador2.toLowerCase() === 'bye') {
        emparejamiento = `${m.jugador1} <span class="bye">- BYE</span>`;
      } else {
        emparejamiento = `${m.jugador1} <span class="vs">vs</span> ${m.jugador2}`;
      }
      html += `<tr><td class="mesa-num">${m.mesa}</td><td>${emparejamiento}</td></tr>`;
    });
    html += '</tbody></table>';
  });
  html += '</div>';
  container.innerHTML = html;
}

function actualizarContador(contador) {
  const box = document.getElementById(`contador-${contador.id}`);
  if (!box) return;
  
  // Actualizar clase activo
  if (contador.contadorActivo) {
    box.classList.add('activo');
  } else {
    box.classList.remove('activo');
  }
  
  // Actualizar tiempo
  const display = box.querySelector('.contador-display');
  if (display) {
    display.textContent = formatoTiempo(contador.tiempoRestante);
    display.style.color = contador.colorContador;
  }
  
  // Actualizar texto (con ronda si existe)
  const texto = box.querySelector('.texto-contador');
  if (texto) {
    let textoMostrar = contador.texto;
    if (textoMostrar === 'Preparado para iniciar' && (contador.contadorActivo || contador.tiempoFinalizacion)) {
      textoMostrar = '';
    }
    if (contador.configMesas && contador.configMesas.ronda) {
      texto.textContent = textoMostrar ? contador.configMesas.ronda + ' - ' + textoMostrar : contador.configMesas.ronda;
    } else {
      texto.textContent = textoMostrar;
    }
    texto.style.color = contador.colorTexto;
  }
  
  // Actualizar fondo
  box.style.backgroundColor = contador.colorFondo || '#000';
  
  // Actualizar logo
  const logoContainer = document.getElementById(`logo-container-${contador.id}`);
  if (logoContainer) {
    if (contador.logo && contador.logo.archivo) {
      logoContainer.innerHTML = `<img src="/logos/${contador.logo.archivo}" alt="Logo">`;
    } else {
      logoContainer.innerHTML = '';
    }
  }
  
  // Audio
  const audioPlayer = document.getElementById(`audio-${contador.id}`);
  if (contador.audio && contador.audio.reproduciendo && audioPlayer) {
    if (!audioPlayers[contador.id]) {
      audioPlayer.src = `/audio/${contador.audio.archivo}`;
      audioPlayer.play().catch(e => console.error('Error:', e));
      audioPlayers[contador.id] = true;
    }
  }
  
  if (contador.tiempoRestante > 0 && audioPlayers[contador.id]) {
    audioPlayers[contador.id] = false;
  }
  
  // Parpadeo
  const finEl = document.getElementById(`fin-${contador.id}`);
  const tiempoTranscurrido = contador.tiempoFinalizacion ? (Date.now() - contador.tiempoFinalizacion) : 0;
  const debeParpadear = contador.tiempoRestante === 0 && 
                        contador.tiempoFinalizacion && 
                        tiempoTranscurrido < DURACION_PARPADEO;
  
  if (debeParpadear) {
    if (finEl) finEl.textContent = 'Â¡Tiempo Terminado!';
    
    if (!parpadeoIntervals[contador.id]) {
      let visible = true;
      parpadeoIntervals[contador.id] = setInterval(() => {
        if (display) display.style.visibility = visible ? 'hidden' : 'visible';
        visible = !visible;
      }, 500);
      
      setTimeout(() => {
        if (parpadeoIntervals[contador.id]) {
          clearInterval(parpadeoIntervals[contador.id]);
          parpadeoIntervals[contador.id] = null;
          if (display) display.style.visibility = 'visible';
        }
      }, DURACION_PARPADEO);
    }
  } else {
    if (finEl) finEl.textContent = '';
    if (parpadeoIntervals[contador.id]) {
      clearInterval(parpadeoIntervals[contador.id]);
      parpadeoIntervals[contador.id] = null;
      if (display) display.style.visibility = 'visible';
    }
  }
  
  // Actualizar iconos y mesas
  actualizarIconos(contador);
  actualizarMesas(contador);
}

async function cargarContadores() {
  try {
    const res = await fetch(`${API}/contadores/visibles`);
    const data = await res.json();
    
    // Si solo hay 1 contador visible, redirigir a vista individual
    if (data.contadores.length === 1) {
      window.location.href = '/';
      return;
    }
    
    // Si no hay contadores visibles, mostrar mensaje
    if (data.contadores.length === 0) {
      const container = document.getElementById('gridContainer');
      container.innerHTML = '<div style="display:flex; align-items:center; justify-content:center; height:100vh; font-size:3vh; color:#888;">No hay contadores visibles. Marca al menos uno desde el panel de administración.</div>';
      return;
    }
    
    const nuevosIds = data.contadores.map(c => c.id).sort().join(',');
    const actualesIds = contadoresActuales.map(c => c.id).sort().join(',');
    const nuevaOrientacion = data.orientacion || 'horizontal';
    
    // Si cambiaron los contadores visibles o la orientaciÃ³n, recrear grid
    if (nuevosIds !== actualesIds || nuevaOrientacion !== orientacionActual) {
      contadoresActuales = data.contadores;
      orientacionActual = nuevaOrientacion;
      
      const container = document.getElementById('gridContainer');
      container.innerHTML = '';
      
      contadoresActuales.forEach(contador => {
        const box = crearContadorBox(contador);
        container.appendChild(box);
      });
      
      actualizarGrid();
      
      // Actualizar iconos y mesas después de crear las boxes
      contadoresActuales.forEach(contador => {
        actualizarIconos(contador);
        actualizarMesas(contador);
      });
    } else {
      // Solo actualizar datos
      contadoresActuales = data.contadores;
      contadoresActuales.forEach(contador => {
        actualizarContador(contador);
      });
    }
  } catch (error) {
    console.error('Error cargando contadores:', error);
  }
}

// Actualizar cada segundo
setInterval(cargarContadores, 1000);
cargarContadores();
</script>
</body>
</html>
