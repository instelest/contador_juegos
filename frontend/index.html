<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Contador</title>
<style>
body { 
  font-family: Arial, sans-serif; 
  background-color: #000; 
  color: #fff; 
  margin: 0; 
  padding: 0;
  overflow-x: hidden;
  position: relative;
  min-height: 100vh;
}

#vistaIndividual {
  display: block;
  width: 100vw;
  height: 100vh;
  position: relative;
}

#vistaIndividual.active {
  display: block;
}

#logoContainer {
  position: absolute;
  top: 10px;
  left: 10px;
  width: 340px;
  z-index: 100;
}

#logoContainer img {
  width: 100%;
  height: auto;
}

#iconosContainer {
  position: absolute;
  width: 100%;
  height: 100%;
  top: 0;
  left: 0;
  pointer-events: none;
  z-index: 50;
}

.icono-dinamico {
  position: absolute;
  transform: translate(-50%, -50%);
  object-fit: contain;
  transition: all 0.3s ease;
}

#contadorContainer {
  position: absolute;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  z-index: 10;
}

#textoContador { 
  font-size: 10vh; 
  margin-bottom: 10px;
  text-align: center;
}

#contador { 
  font-size: 40vh; 
  color: #ff3b3b; 
  cursor: pointer;
  user-select: none;
  transition: opacity 0.2s;
  text-align: center;
  line-height: 1;
}

#contador:hover {
  opacity: 0.8;
}

#finMensaje {
  font-weight: bold;
  text-align: center;
  margin-top: 10px;
  font-size: 8vh;
  color: #ff0000;
}

#tablaMesas {
  position: absolute;
  bottom: 20px;
  left: 50%;
  transform: translateX(-50%);
  width: 95%;
  z-index: 5;
  overflow: visible;
}

.tabla-container {
  display: flex;
  gap: 10px;
  justify-content: center;
  flex-wrap: nowrap;
  width: 100%;
  align-items: flex-start;
}

.tabla-container .tabla-mesas {
  flex: 1;
  min-width: 0;
}

.tabla-mesas {
  border-collapse: collapse;
  background-color: rgba(20, 20, 20, 0.9);
  border-radius: 10px;
  overflow: hidden;
  table-layout: fixed;
}

.tabla-mesas thead {
  background-color: #ff3b3b;
  position: sticky;
  top: 0;
  z-index: 1;
}

.tabla-mesas th {
  padding: 15px 8px;
  font-weight: bold;
  text-transform: uppercase;
  letter-spacing: 1px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.tabla-mesas tbody tr {
  border-bottom: 1px solid #333;
  transition: background-color 0.3s;
}

.tabla-mesas tbody tr:hover {
  background-color: rgba(255, 59, 59, 0.1);
}

.tabla-mesas tbody tr:last-child {
  border-bottom: none;
}

.tabla-mesas td {
  padding: 6px 8px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.mesa-num {
  font-weight: bold;
  color: #ff8800;
}

@media (max-width: 768px) {
  #tablaMesas {
    width: 98%;
  }
  
  .tabla-mesas {
    font-size: 1.5vh;
  }
  
  .tabla-mesas th,
  .tabla-mesas td {
    padding: 4px;
  }
}

#vistaMultiple {
  display: none;
  width: 100vw;
  height: 100vh;
  position: relative;
  justify-content: center;
  align-items: center;
  flex-direction: column;
}

#vistaMultiple.active {
  display: flex;
}

#mensajeRedireccion {
  font-size: 3vh;
  color: #2a5;
  margin-bottom: 20px;
}

audio {
  display: none;
}
</style>
</head>
<body>

<div id="vistaIndividual">
  <div id="logoContainer"><img src="logo.png" alt="Logo" id="logo"></div>
  <div id="iconosContainer"></div>

  <div id="contadorContainer">
    <div id="textoContador">Preparado para iniciar</div>
    <div id="contador">00:00</div>
    <div id="finMensaje"></div>
  </div>

  <audio id="audioPlayer"></audio>
  <div id="tablaMesas"></div>
</div>

<div id="vistaMultiple">
  <div id="mensajeRedireccion">Redirigiendo a vista múltiple...</div>
</div>

<script src="script.js"></script>
</body>
</html>
